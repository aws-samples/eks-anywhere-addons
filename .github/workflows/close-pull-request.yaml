name: PR Closed - purging developer_branch
on: 
  pull_request_target:
    branches: [main]
    types: [closed]
     
permissions:
  contents: write

jobs:

  # Reverse the testing commits the deploy workflow pushed for this PR. This
  # runs on every closed PR with no label guard: the anchored trailer match
  # below only touches THIS PR's own testing commit, so an untested PR is a
  # harmless no-op. Running unconditionally is also required so that
  # commit-accepted-pr-files (which `needs` this job) is not skipped via
  # needs-propagation when a PR is merged without ever being E2E-tested.
  revert-testing-commit:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: developer_branch
        fetch-depth: 0
    - name: Remove Updates from this PR
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Revert Commits or Log that no change was made
        git config --local user.email "dev@null"
        git config --local user.name "Conformitron Bot"

        # Match the exact "Conformitron-Test-PR: <n>" trailer written by the
        # open/sync workflow, anchored to a full line. An unanchored free-text
        # grep for "PR_${PR_NUMBER}" would also match PR_40, PR_400, etc.,
        # letting an old low-numbered PR revert unrelated partners' commits.
        for commit in $(git rev-list HEAD --extended-regexp --grep="^Conformitron-Test-PR: ${PR_NUMBER}\$"); do
          echo $commit
          git revert $commit --no-edit || echo "Commit $commit not reverted"
        done

        git push
        
  # Accepted PR's apply merged changes 
  commit-accepted-pr-files:
    if: github.event.pull_request.merged == true
    needs: revert-testing-commit
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Base
      uses: actions/checkout@v4
      
    - name: Checkout PR Code
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run:
        git fetch origin pull/${PR_NUMBER}/head:pr
        
    - name: Remove Deleted Files, copy over added or modified files in accepted PR
      id: find-namespace-yaml
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Pull file information down into a JSON array
        readarray -t files < <(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" | jq -c '.[]')
        
        # Checkout and update Developer branch 
        git fetch --all
        git config --local user.email "dev@null"
        git config --local user.name "Conformitron Bot"
        # fetch most recent update to dev
        git checkout developer_branch
        git pull
        
        # Enforce the same scope as the workflow trigger's paths-ignore in
        # new-pull-request.yaml. Without this, an accepted PR could copy or
        # delete files outside the submitter's partner directory (another
        # partner's manifests, Validated_Partners/**, .github/**, docs/**).
        # Applied to every operation, deletions included.
        is_in_scope() {
          local f="$1"
          # Reject empty, absolute, or path-traversing entries outright.
          case "$f" in
            ""|/*|*/../*|../*|*/..|..) return 1 ;;
          esac
          case "$f" in
            Validated_Partners|Validated_Partners/*) return 1 ;;
            .github|.github/*) return 1 ;;
            docs|docs/*) return 1 ;;
            .git|.git/*) return 1 ;;
          esac
          return 0
        }

        # Remove Deleted Files, copy over added or modified files
        for item in "${files[@]}"; do
          status=$(echo "$item" | jq -r '.status')
          filename=$(echo "$item" | jq -r '.filename')

          if ! is_in_scope "$filename"; then
            echo "Skipping out-of-scope file: $filename"
            continue
          fi

          if [ "$status" == renamed ]; then
            git checkout pr -- "$filename"
            git add "$filename"
            previous_filename=$(echo "$item" | jq -r '.previous_filename')
            if is_in_scope "$previous_filename" && [ -f "$previous_filename" ]; then
              git rm "$previous_filename"
            fi
            echo "Renaming $filename"
          elif [ "$status" != removed ]; then
            git checkout pr -- "$filename"
            git add "$filename"
            echo "Moving $filename"
          else
            if [ -f "$filename" ]; then
              echo "Deleting $filename"
              git rm "$filename"
            fi
          fi
        done
        
        # Only commit/push when the loop actually staged in-scope changes; an
        # all-out-of-scope PR stages nothing and must not fail the step.
        if git diff --cached --quiet; then
          echo "No in-scope changes to deploy"
        else
          git commit -m "Adding new and changed files for merged PR_${PR_NUMBER}"
          git push
        fi
        
