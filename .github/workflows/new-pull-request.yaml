name: PR Opened - moving new ISV addon to developer_branch for E2E testing

on:
  # Deploys are comment-only (see build.if): the ONLY way a revision reaches
  # developer_branch is a fresh '/test-e2e' comment from a user with write
  # access, evaluated against the PR's current head (see the permission check
  # below). A reviewer therefore authorizes every deployed revision, closing
  # the synchronize / reopened / push-while-closed swaps. Path scope is
  # enforced directly in the copy loop below.
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
        github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/test-e2e')
    steps:
    - name: Check permissions for comments
      id: check-perms
      if: github.event_name == 'issue_comment'
      uses: actions-cool/check-user-permission@main
      with:
        require: "write"
      continue-on-error: false

    - name: Verify permissions
      if: github.event_name == 'issue_comment' && steps.check-perms.outputs.require-result != 'true'
      run: |
        echo "Permission check failed"
        exit 1

    - name: Get PR info
      id: pr
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "${{ github.event_name }}" == "issue_comment" ]; then
          echo "number=${ISSUE_NUMBER}" >> $GITHUB_OUTPUT
          SHA=$(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${ISSUE_NUMBER}" | jq -r ".head.sha")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        else
          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "sha=${PR_SHA}" >> $GITHUB_OUTPUT
        fi

    - name: Checkout Base
      uses: actions/checkout@v4

    - name: Checkout PR Code
      run: git fetch origin pull/${{ steps.pr.outputs.number }}/head:pr

    - name: Parse Namespace data, Create ConfigMap
      id: find-namespace-yaml
      run: |
        # Pull file information down into a JSON array
        readarray -t files < <(curl -s "https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/files" | jq -c ".[]")
        
        # Move updated files over to dev branch
        git fetch --all
        git config --local user.email "dev@null"
        git config --local user.name "Conformitron Bot"
        # fetch most recent update to dev
        git checkout developer_branch
        git pull
        
        # Enforce the same scope as the workflow trigger's paths-ignore.
        # paths-ignore only decides whether the workflow starts; it does NOT
        # limit which files this loop copies. Without this check a PR that
        # touches one legitimate file could also modify or delete any other
        # path (another partner's manifests, Validated_Partners/**, .github/**,
        # docs/**). This guard is applied to every operation, deletions included.
        is_in_scope() {
          local f="$1"
          # Reject empty, absolute, or path-traversing entries outright.
          case "$f" in
            ""|/*|*/../*|../*|*/..|..) return 1 ;;
          esac
          # Mirror paths-ignore: these prefixes are never writable via a PR.
          case "$f" in
            Validated_Partners|Validated_Partners/*) return 1 ;;
            .github|.github/*) return 1 ;;
            docs|docs/*) return 1 ;;
            .git|.git/*) return 1 ;;
          esac
          return 0
        }

        # Remove Deleted Files, copy over added or modified files
        for item in "${files[@]}"; do
          status=$(echo "$item" | jq -r ".status")
          filename=$(echo "$item" | jq -r ".filename")

          if ! is_in_scope "$filename"; then
            echo "Skipping out-of-scope file: $filename"
            continue
          fi

          if [ "$status" == renamed ]; then
            git checkout pr -- "$filename"
            git add "$filename"
            previous_filename=$(echo "$item" | jq -r ".previous_filename")
            if is_in_scope "$previous_filename" && [ -f "$previous_filename" ]; then
              git rm "$previous_filename"
            fi
            echo "Renaming $filename"
          elif [ "$status" != removed ]; then
            git checkout pr -- "$filename"
            git add "$filename"
            echo "Moving $filename"
          else
            if [ -f "$filename" ]; then
              echo "Deleting $filename"
              git rm "$filename"
            fi
          fi
        done
        
        
        # Create ConfigMap for each file's partner folder
        for item in "${files[@]}"; do
          status=$(echo "$item" | jq -r ".status")
          filename=$(echo "$item" | jq -r ".filename")
          echo $filename

          if ! is_in_scope "$filename"; then
            echo "Skipping out-of-scope file: $filename"
            continue
          fi

          if [ "$status" != removed ] && [[ $filename != *README.md ]]; then
            # Parse namespace data
            subdirectory=$(dirname $filename)
            namespace_file_subdirectory=$(dirname $filename)
            namespace_file=$(find $namespace_file_subdirectory -name *namespace*)
            namespace_name=""
            partner_name=""
            
            # get namespace from dev branch partner directory. If in Testers directory, re-align to Addons/Partner/{partner}
            while [ -z "$(find $namespace_file_subdirectory -name '*namespace*')" ] && [[ -z $namespace_name ]]; do
              partner_name=$(basename $namespace_file_subdirectory)
              namespace_file_subdirectory=$(dirname $namespace_file_subdirectory)
              if [ $(basename $namespace_file_subdirectory) == "Testers" ]; then
                namespace_file_subdirectory=$(dirname $namespace_file_subdirectory)
                namespace_file_subdirectory=$namespace_file_subdirectory/Addons/Partner/$partner_name
              elif [ $(basename $namespace_file_subdirectory) == "Patches" ]; then
                namespace_file_subdirectory=eks-anywhere-common/Addons/Partner/$partner_name
              elif [ $(basename $namespace_file_subdirectory) == "Partner" ] || [ $(basename $namespace_file_subdirectory) == "Core" ]; then
                echo "No Namespace File Found in Partner Directory"
                exit 200
              fi
              namespace_file=$(find $namespace_file_subdirectory -name "*namespace*")
            done
            
            if [ -f $namespace_file ]; then
              namespace_file_subdirectory=$(dirname $namespace_file)
              namespace_name=$(grep -E '^\s*metadata:\s*$|^\s*name:\s*' "$namespace_file" | awk -F':' '{gsub(/ /, "", $2); print $2}')
            else
              echo "No Namespace file found"
              exit 200
            fi
            
            if [[ -n $namespace_name ]]; then
              namespace=$(echo $namespace_name | xargs echo -n)
              config_map_file="config-map-${{ steps.pr.outputs.number }}.yml"
              echo "apiVersion: v1" >> $config_map_file
              echo "kind: ConfigMap" >> $config_map_file
              echo "metadata:" >> $config_map_file
              echo "  name: $namespace-configmap" >> $config_map_file
              echo "  namespace: $namespace" >> $config_map_file
              echo "  labels:" >> $config_map_file
              echo "    bot: conformitron" >> $config_map_file
              echo "data:" >> $config_map_file
              echo "  Namespace: ${namespace}" >> $config_map_file
              echo "  prNumber: \"${{ steps.pr.outputs.number }}\"" >> $config_map_file
              echo "  commitHash: ${{ steps.pr.outputs.sha }}" >> $config_map_file
              echo "  deployed: \"$(date +%s)\"" >> $config_map_file
              echo "  env: $(echo $subdirectory | cut -f1 -d/ | awk -F-  '{print $NF}' )"  >> $config_map_file
              mkdir -p ./$namespace_file_subdirectory/
              mv "$config_map_file" ./$namespace_file_subdirectory/
              git add ./$namespace_file_subdirectory/
          
            else
              echo "No Namespace found, Invalid namespace file"
              exit 100
            fi
          fi        
        done
        
        # Only commit/push when the loop actually staged in-scope changes. A PR
        # whose files are all out of scope stages nothing; committing then would
        # fail the step even though rejecting those files is the correct outcome.
        # The trailer gives the close workflow an exact, machine-matchable marker
        # to revert against (see close-pull-request.yaml), instead of a free-text
        # grep that matches PR_4 against PR_40, PR_400, etc.
        if git diff --cached --quiet; then
          echo "No in-scope changes to deploy"
        else
          git commit -m "Adding new and changed files for testing of PR_${{ steps.pr.outputs.number }}" -m "Conformitron-Test-PR: ${{ steps.pr.outputs.number }}"
          git push
        fi
